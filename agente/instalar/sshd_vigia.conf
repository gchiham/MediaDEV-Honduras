# Agregar AL FINAL de /etc/ssh/sshd_config (no en sshd_config.d: allí se incluye al principio).
# Validar con `sshd -t` y `sshd -T -C user=vigia,host=x,addr=<IP_MEDIAAPP>` ANTES de recargar,
# con otra sesión de root abierta. ForceCommand manda aunque alguien edite la llave autorizada.
Match User vigia
    ForceCommand /usr/local/bin/mediacap-ro
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
