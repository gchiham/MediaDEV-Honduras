# Agregar AL FINAL de /etc/ssh/sshd_config (no en sshd_config.d: allí se incluye al principio).
# Validar con `sshd -t` y `sshd -T -C user=auditor,host=x,addr=10.136.0.6` ANTES de recargar,
# con otra sesión de root abierta. ForceCommand manda aunque alguien edite la llave autorizada,
# y también reemplaza sftp/scp: el auditor solo puede recibir el inventario.
Match User auditor
    ForceCommand /bin/cat /var/lib/mediacap-auditor/inventario.json
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
